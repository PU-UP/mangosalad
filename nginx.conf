server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mangosalad.cn www.mangosalad.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mangosalad; }
    location / { return 301 https://mangosalad.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mangosalad.cn;
    ssl_certificate /etc/letsencrypt/live/mangosalad.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangosalad.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:5010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
    }
}
